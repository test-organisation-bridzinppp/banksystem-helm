argo-cd:
  nameOverride: argocd
  crds:
    install: false
  namespaceOverride: argocd
  global:
    domain: argocd.twojadomena.pl

  server:
    # 1. Dodanie flagi informującej ArgoCD, że działa bez TLS (insecure)
    extraArgs:
      - --insecure

    # 2. Konfiguracja Ingress dla czystego HTTP
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts:
        - argocd.twojadomena.pl
      # Sekcja tls została całkowicie usunięta
      tls: []
      annotations:
        # Informujemy Nginx Ingress, że backend nasłuchuje na HTTP, a nie HTTPS
        nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
        # Wyłączamy automatyczne wymuszanie przekierowania z HTTP na HTTPS
        nginx.ingress.kubernetes.io/ssl-redirect: "false"

    # 3. Zarządzanie uprawnieniami (RBAC)
    rbacConfig:
      policy.default: role:readonly
      policy.csv: |
        g, dev-team, role:admin

  # 4. Główna konfiguracja ArgoCD
  configs:
    cm:
      admin.enabled: "true"
      timeout.reconciliation: 180s
      ui.bannercontent: "Środowisko Testowe ArgoCD (HTTP)"

  # 5. Skalowanie i zasoby
  controller:
    resources:
      limits:
        cpu: 2000m
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 512Mi

  repoServer:
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi