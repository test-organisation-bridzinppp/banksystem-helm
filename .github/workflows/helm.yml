name: Helm chart

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint charts/banksystem

      - name: Package chart
        run: |
          mkdir -p dist
          helm package charts/banksystem --destination dist

      - uses: actions/upload-artifact@v4
        with:
          name: banksystem-chart
          path: dist/*.tgz

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Initialize GitHub Pages branch
        shell: bash
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git switch --orphan gh-pages
            git rm -rf --ignore-unmatch .
            touch .nojekyll
            git add .nojekyll
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Initialize gh-pages"
            git push origin gh-pages
            git switch main
          fi

      - uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: charts/banksystem/charts
          pages_branch: gh-pages
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for dependency charts on GitHub Pages
        shell: bash
        run: |
          index_url="https://test-organisation-bridzinppp.github.io/banksystem-helm/index.yaml"
          for attempt in {1..30}; do
            index=$(curl --fail --silent "$index_url?run=${GITHUB_RUN_ID}-${attempt}" || true)
            if grep -Fq 'rabbitmq-0.0.2/rabbitmq-0.0.2.tgz' <<< "$index" && \
              grep -Fq 'redis-0.0.2/redis-0.0.2.tgz' <<< "$index"; then
              echo "Dependency charts are available from GitHub Pages."
              exit 0
            fi
            echo "Waiting for GitHub Pages to publish dependency charts (attempt $attempt/30)."
            sleep 10
          done
          echo "Timed out waiting for rabbitmq and redis charts in the GitHub Pages index." >&2
          exit 1

      - uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: charts
          pages_branch: gh-pages
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}