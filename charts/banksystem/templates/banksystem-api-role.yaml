apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: banksystem-api-role
  labels:
    app: banksystem-api
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: banksystem-api-rolebinding
  labels:
    app: banksystem-api
subjects:
- kind: ServiceAccount
  name: banksystem-api-sa
  namespace: default
roleRef:
  kind: Role
  name: banksystem-api-role
  apiGroup: rbac.authorization.k8s.io